services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [qdrant, mlflow]
    volumes: ["./data:/app/data"]
    user: "10001:10001"
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlartifacts"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  qdrant_data:
  mlflow_data:
